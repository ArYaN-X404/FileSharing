version: '3.8'

services:
  filesharing-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filesharing-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8085}:${PORT:-8085}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8085}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
